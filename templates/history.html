<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - {{ metric }}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a14;
            --panel: #1a1a2e;
            --text: #ffffff;
            --text-dim: #888899;
            --accent: #4dafff;
            --border: rgba(255,255,255,0.08);
        }

        body {
            font-family: -apple-system, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: grid;
            grid-template-columns: 80px 1fr 80px;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .back-btn {
            background: transparent;
            color: var(--text);
            border: none;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
        }

        .header .title {
            text-align: center;
            font-size: 1rem;
            color: var(--text-dim);
        }

        .range-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 16px;
        }

        .range-buttons button {
            background: var(--panel);
            color: var(--text-dim);
            border: 1px solid var(--border);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .range-buttons button.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .chart-wrapper {
            flex: 1;
            padding: 10px 20px 20px;
            min-height: 0;
        }

        .chart-container {
            width: 100%;
            height: 100%;
            min-height: 400px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .stats .stat { text-align: center; }

        .stats .label {
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stats .stat-value {
            font-size: 1.4rem;
            font-weight: 300;
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="back-btn" onclick="window.location='/'">← Back</button>
        <span class="title" id="metricTitle">{{ metric }}</span>
        <span></span>
    </div>

    <div class="range-buttons">
        <button onclick="setRange('hour', this)" class="active">Hour</button>
        <button onclick="setRange('day', this)">Day</button>
        <button onclick="setRange('week', this)">Week</button>
    </div>

    <div class="chart-wrapper">
        <div class="chart-container">
            <canvas id="historyChart"></canvas>
        </div>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="label">Min</div>
            <div class="stat-value" id="statMin">—</div>
        </div>
        <div class="stat">
            <div class="label">Avg</div>
            <div class="stat-value" id="statAvg">—</div>
        </div>
        <div class="stat">
            <div class="label">Max</div>
            <div class="stat-value" id="statMax">—</div>
        </div>
    </div>

    <script>
        const metric = "{{ metric }}";
        let currentRange = 'hour';
        let chart = null;

        const metricInfo = {
            temperature: { label: 'Temperature', unit: '°F', color: '#ff4d4d' },
            humidity: { label: 'Humidity', unit: '%', color: '#4dafff' },
            pressure: { label: 'Pressure', unit: 'hPa', color: '#ffd24d' },
            light: { label: 'Light', unit: 'lux', color: '#ffffff' },
            proximity: { label: 'Proximity', unit: '', color: '#4dafff' },
            oxidising: { label: 'Oxidising', unit: 'kΩ', color: '#ff6b9d' },
            reducing: { label: 'Reducing', unit: 'kΩ', color: '#6bffb8' },
            nh3: { label: 'NH3', unit: 'kΩ', color: '#c76bff' },
            pm1: { label: 'PM1', unit: 'µg/m³', color: '#4dafff' },
            pm25: { label: 'PM2.5', unit: 'µg/m³', color: '#ff9d6b' },
            pm10: { label: 'PM10', unit: 'µg/m³', color: '#ff4d4d' }
        };

        document.getElementById('metricTitle').textContent = metricInfo[metric].label;

        // Convert hex color to rgba with given alpha for band fills
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            return `rgba(${r},${g},${b},${alpha})`;
        }

        // Compute padded y-axis range (20% breathing room)
        function paddedRange(values) {
            if (values.length === 0) return {};
            const min = Math.min(...values);
            const max = Math.max(...values);
            const range = max - min || 1;
            const padding = range * 0.20;
            return { min: min - padding, max: max + padding };
        }

        function loadData() {
            fetch('/history?range=' + currentRange)
                .then(r => r.json())
                .then(history => {
                    if (chart) chart.destroy();
                    drawChart(history);
                    updateStats(history);
                });
        }

        function drawChart(history) {
            const labels = history.map(r => new Date(r.timestamp).toLocaleString([], {
                month: 'numeric', day: 'numeric',
                hour: '2-digit', minute: '2-digit'
            }));

            const color = metricInfo[metric].color;
            const isDownsampled = history.length > 0 && history[0].min !== null && history[0].min !== undefined;

            const datasets = [];

            // If downsampled, draw the min/max band first (so it sits behind the line)
            if (isDownsampled) {
                const maxValues = history.map(r => r.max[metric]);
                const minValues = history.map(r => r.min[metric]);

                datasets.push({
                    label: 'Max',
                    data: maxValues,
                    borderColor: 'transparent',
                    backgroundColor: hexToRgba(color, 0.15),
                    pointRadius: 0,
                    fill: '+1'  // fill down to the next dataset (min)
                });
                datasets.push({
                    label: 'Min',
                    data: minValues,
                    borderColor: 'transparent',
                    backgroundColor: 'transparent',
                    pointRadius: 0,
                    fill: false
                });
            }

            // Main average/value line
            datasets.push({
                label: metricInfo[metric].label,
                data: history.map(r => r[metric]),
                borderColor: color,
                backgroundColor: hexToRgba(color, 0.10),
                borderWidth: 2,
                pointRadius: isDownsampled ? 0 : 2,
                tension: 0.3,
                fill: !isDownsampled
            });

            // Compute padded y-axis range from ALL relevant data points
            let allValues = history.map(r => r[metric]);
            if (isDownsampled) {
                allValues = allValues
                    .concat(history.map(r => r.min[metric]))
                    .concat(history.map(r => r.max[metric]));
            }
            const yRange = paddedRange(allValues);

            chart = new Chart(document.getElementById('historyChart'), {
                type: 'line',
                data: { labels: labels, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#888899', font: { size: 10 }, maxTicksLimit: 6 },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        },
                        y: {
                            min: yRange.min,
                            max: yRange.max,
                            ticks: { color: '#888899', font: { size: 10 } },
                            grid: { color: 'rgba(255,255,255,0.05)' }
                        }
                    }
                }
            });
        }

        function updateStats(history) {
            if (history.length === 0) {
                document.getElementById('statMin').textContent = '—';
                document.getElementById('statAvg').textContent = '—';
                document.getElementById('statMax').textContent = '—';
                return;
            }

            const isDownsampled = history[0].min !== null && history[0].min !== undefined;

            // Compute true min, max, avg across the period
            let min, max, avg;
            if (isDownsampled) {
                min = Math.min(...history.map(r => r.min[metric]));
                max = Math.max(...history.map(r => r.max[metric]));
                const avgs = history.map(r => r[metric]);
                avg = avgs.reduce((a, b) => a + b, 0) / avgs.length;
            } else {
                const values = history.map(r => r[metric]);
                min = Math.min(...values);
                max = Math.max(...values);
                avg = values.reduce((a, b) => a + b, 0) / values.length;
            }

            const unit = metricInfo[metric].unit;
            document.getElementById('statMin').textContent = min.toFixed(1) + ' ' + unit;
            document.getElementById('statAvg').textContent = avg.toFixed(1) + ' ' + unit;
            document.getElementById('statMax').textContent = max.toFixed(1) + ' ' + unit;
        }

        function setRange(range, button) {
            currentRange = range;
            document.querySelectorAll('.range-buttons button').forEach(b => b.classList.remove('active'));
            button.classList.add('active');
            loadData();
        }

        loadData();
        setInterval(loadData, 60000);
    </script>

</body>
</html>
